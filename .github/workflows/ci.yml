name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.0
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledgerlite
          POSTGRES_PASSWORD: ledgerlite
          POSTGRES_DB: ledgerlite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerlite -d ledgerlite_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://ledgerlite:ledgerlite@localhost:5432/ledgerlite_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements*.txt"
      - run: pip install -r wallet-service/requirements-dev.txt -r provider-mock/requirements-dev.txt
      - name: wallet-service tests
        working-directory: wallet-service
        run: pytest -v
      - name: provider-mock tests
        working-directory: provider-mock
        run: pytest -v

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: smoke test
        run: python3 scripts/smoke_test.py
      - name: logs on failure
        if: failure()
        run: docker compose logs
      - name: tear down
        if: always()
        run: docker compose down -v
